version: "3.8"

services:
  vidlang-api:
    build: .
    container_name: vidlang-api
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    volumes:
      - ./output:/app/output
      - ./jobs:/app/jobs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
